<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo} = React;

const MAX_ROWS = 20000; // backend bilan mos (app.py: MAX_QATORLAR_PER_VARAQ)
const COUNT_COL = "__count__";

function fmtNum(n){
  if (n===null||n===undefined||isNaN(n)) return "-";
  const rounded = Math.round(n*100)/100;
  return rounded.toLocaleString("ru-RU").replace(/,/g," ");
}
function fmtInt(n){
  if (n===null||n===undefined||isNaN(n)) return "-";
  return Math.round(n).toLocaleString("ru-RU").replace(/,/g," ");
}

// ---------- Excel'ni UMUMIY (har qanday shablon) tarzda o'qish ----------

function excelDateToStr(d){
  const y=d.getUTCFullYear(), m=d.getUTCMonth()+1, day=d.getUTCDate();
  if (!y || y < 1000) return "";
  return `${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function detectColType(values){
  let nonEmpty=0, numCount=0, dateCount=0;
  for (const v of values){
    if (v==="" || v===null || v===undefined) continue;
    nonEmpty++;
    if (v instanceof Date) dateCount++;
    else if (typeof v === "number") numCount++;
  }
  if (nonEmpty===0) return "matn";
  if (dateCount/nonEmpty > 0.5) return "sana";
  if (numCount/nonEmpty > 0.5) return "son";
  return "matn";
}

// Bitta qator "faqat matn" qatormi (kamida bitta to'ldirilgan katak bor,
// lekin ichida son yoki sana yo'q) - sarlavha blokini aniqlashda ishlatiladi.
function isTextOnlyRow(row){
  let hasContent = false;
  for (const v of row){
    if (v===undefined || v===null || v==="") continue;
    hasContent = true;
    if (typeof v === "number" || v instanceof Date) return false;
  }
  return hasContent;
}

function parseWorkbookToVaraqlar(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:"array", cellDates:true});
  const varaqlar = [];
  for (const sheetName of wb.SheetNames){
    const sheet = wb.Sheets[sheetName];
    // blankrows:false: bo'sh qatorlar (masalan sarlavha bilan jadval orasidagi
    // ajratuvchi bo'sh qator) avtomatik olib tashlanadi.
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, blankrows:false});
    if (!rows.length) continue;

    // ---- Sarlavha blokini aniqlash ----
    // Ko'p haqiqiy hisobotlarda 1-qator jadval sarlavhasi emas, balki
    // kompaniya nomi/hisobot nomi kabi "sarlavha" bo'ladi, va ustun nomlari
    // (ba'zan 2 qatorga bo'lingan - masalan "Умумий қарз" ustidan
    // "60 kungacha"/"60-90 kun"/"90 kundan ortiq" pastki sarlavhalar bilan)
    // pastroqda joylashadi. Shuning uchun 1-qatorni "shartsiz" sarlavha deb
    // olish ko'p ustunni butunlay yo'qotib qo'yardi (faqat 1-qatorda
    // to'ldirilgan ustunlar saqlanardi, qolganlari tashlab yuborilardi).
    //
    // Endi: yuqoridan boshlab ketma-ket "faqat matn" qatorlarni (son/sana
    // yo'q) sarlavha blokiga qo'shib boramiz - birinchi son yoki sana
    // uchragan qatorgacha (bu haqiqiy ma'lumot boshlanishi). Agar bunday
    // qator sarlavha blokidan keyin (masalan 6-7 qatorgacha) topilmasa,
    // demak butun varaq faqat matndan iborat - bunday holda xavfsizlik
    // uchun faqat 1-qatorni sarlavha deb olamiz (eski xatti-harakat).
    const MAX_HEADER_BLOCK = 6;
    let headerBlockLen = 0;
    let foundDataBoundary = false; // true = son/sana qatoriga yetib to'xtadi (ishonchli chegara)
    while (headerBlockLen < rows.length - 1 && headerBlockLen < MAX_HEADER_BLOCK){
      if (!isTextOnlyRow(rows[headerBlockLen])) { foundDataBoundary = true; break; }
      headerBlockLen++;
    }
    // Agar hech qachon son/sana qatoriga duch kelmasak (masalan butun varaq
    // faqat matndan iborat - ustunlarning barchasi kategoriya/nom bo'lsa),
    // "chegara"ni ishonchli deb bo'lmaydi - shunday holatda xavfsiz
    // standart holatga (faqat 1-qator sarlavha) qaytamiz, aks holda haqiqiy
    // ma'lumot qatorlarini ham "sarlavha" deb yutib yuborgan bo'lardik.
    if (!foundDataBoundary) headerBlockLen = Math.min(headerBlockLen, 1);
    if (headerBlockLen === 0) headerBlockLen = 1;

    const headerBlock = rows.slice(0, headerBlockLen).map(r => Array.from(r || []));
    const dataRows = rows.slice(headerBlockLen);
    if (!dataRows.length) continue;

    // Varaqning haqiqiy kenglagi (!ref oralig'idan) - shunda hech qanday
    // ustun (sarlavha blokidagi qatorlarda bo'sh, lekin quyida ma'lumoti bor
    // ustun ham) yo'qolib qolmaydi.
    let refWidth = 0;
    if (sheet["!ref"]) {
      try {
        const range = XLSX.utils.decode_range(sheet["!ref"]);
        refWidth = range.e.c - range.s.c + 1;
      } catch(e) { /* e'tiborsiz - quyidagi fallback ishlaydi */ }
    }
    const width = Math.min(
      60, // g'oyat keng jadvallardan himoya
      Math.max(refWidth, ...headerBlock.map(r=>r.length), 1)
    );

    // Har ustun uchun: sarlavha blokidagi qatorlarni yuqoridan pastga qarab
    // ko'rib chiqamiz va OXIRGI bo'sh-bo'lmagan qiymatni olamiz - shunda
    // ikki qatorli (asosiy+quyi) sarlavhalarda quyi (aniqroq) nom ustunga
    // biriktiriladi, lekin faqat asosiy qatorda nomi bo'lgan ustunlar ham
    // (quyi qatorda bo'sh bo'lsa) o'z nomini yo'qotmaydi.
    const mergedHeaderVals = [];
    for (let ci=0; ci<width; ci++){
      let val;
      for (const hr of headerBlock){
        const v = hr[ci];
        if (v!==undefined && v!==null && String(v).trim()!=="") val = v;
      }
      mergedHeaderVals.push(val);
    }

    const seen = {};
    const headers = mergedHeaderVals.map((h,i)=>{
      let name = (h===undefined||h===null||String(h).trim()==="") ? `Ustun${i+1}` : String(h).trim();
      if (seen[name]!==undefined){ seen[name]++; name = `${name}_${seen[name]}`; } else { seen[name]=0; }
      return name;
    });

    // avval har ustun uchun tur aniqlash uchun xom qiymatlarni yig'amiz
    const colValues = headers.map(()=>[]);
    dataRows.forEach(r=>{ headers.forEach((_,ci)=>colValues[ci].push(r[ci])); });
    const colTypes = colValues.map(vals=>detectColType(vals));

    const qatorlar = dataRows.slice(0, MAX_ROWS).map(r=>{
      const out = {};
      headers.forEach((h,ci)=>{
        let v = r[ci];
        if (v===undefined) v = "";
        if (colTypes[ci]==="sana"){
          out[h] = (v instanceof Date) ? excelDateToStr(v) : (v===""?"":String(v));
        } else if (colTypes[ci]==="son"){
          out[h] = (typeof v==="number") ? v : (v===""?"":(isNaN(Number(v))?"":Number(v)));
        } else {
          out[h] = (v instanceof Date) ? excelDateToStr(v) : String(v).trim();
        }
      });
      return out;
    });

    // butunlay bo'sh qatorlarni chiqarib tashlaymiz
    const nonEmptyQatorlar = qatorlar.filter(r => headers.some(h => r[h]!==""));
    if (nonEmptyQatorlar.length===0) continue;

    varaqlar.push({
      nomi: sheetName,
      ustunlar: headers.map((h,ci)=>({nomi:h, turi:colTypes[ci]})),
      qatorlar: nonEmptyQatorlar,
    });
  }
  return varaqlar;
}

// ---------- Statistika ----------

// Serverda ilgari (eski xatolik tufayli) saqlangan hisobotlarda "ustunlar"
// ichida haqiqiy `null` elementlar bo'lishi mumkin edi. Bu yordamchi shu
// holatlarni ham xavfsiz qiladi - null'larni shunchaki e'tiborsiz qoldiradi,
// ilova buzilmaydi.
function sanitizeReport(report){
  if (!report || !Array.isArray(report.varaqlar)) return report;
  return {
    ...report,
    varaqlar: report.varaqlar.map(v => ({
      ...v,
      ustunlar: (v.ustunlar || []).filter(u => u && typeof u === "object"),
    })),
  };
}

function computeStats(ustunlar, qatorlar){
  const dateCols = ustunlar.filter(u=>u.turi==="sana").map(u=>u.nomi);
  const numCols = ustunlar.filter(u=>u.turi==="son").map(u=>u.nomi);
  const catCols = ustunlar.filter(u=>u.turi==="matn").map(u=>u.nomi);

  const numStats = {};
  numCols.forEach(c=>{
    let sum=0,min=Infinity,max=-Infinity,count=0;
    qatorlar.forEach(r=>{
      const v=r[c];
      if (typeof v==="number" && !isNaN(v)){ sum+=v; count++; if(v<min)min=v; if(v>max)max=v; }
    });
    numStats[c] = count>0 ? {sum,avg:sum/count,min,max,count} : null;
  });

  const dateRange = {};
  dateCols.forEach(c=>{
    let min=null,max=null;
    qatorlar.forEach(r=>{ const v=r[c]; if (typeof v==="string" && v){ if(!min||v<min)min=v; if(!max||v>max)max=v; } });
    dateRange[c] = {min,max};
  });

  const catCounts = {};
  const catDistinct = {};
  catCols.forEach(c=>{
    const m = {};
    qatorlar.forEach(r=>{ const v=String(r[c]||"").trim(); if(!v) return; m[v]=(m[v]||0)+1; });
    catDistinct[c] = Object.keys(m).length;
    catCounts[c] = Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);
  });

  return {dateCols, numCols, catCols, numStats, dateRange, catCounts, catDistinct, rowCount: qatorlar.length};
}

function groupByMonth(qatorlar, dateCol, numCol){
  const m = {};
  qatorlar.forEach(r=>{
    const d = r[dateCol];
    if (!d) return;
    const month = String(d).slice(0,7);
    if (!month || month.length!==7) return;
    const v = numCol===COUNT_COL ? 1 : r[numCol];
    if (numCol!==COUNT_COL && typeof v!=="number") return;
    m[month] = (m[month]||0) + (numCol===COUNT_COL ? 1 : v);
  });
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
}

function groupByCategory(qatorlar, catCol, numCol, topN=10){
  const m = {};
  qatorlar.forEach(r=>{
    const k = String(r[catCol]||"").trim();
    if (!k) return;
    const v = numCol===COUNT_COL ? 1 : r[numCol];
    if (numCol!==COUNT_COL && typeof v!=="number") return;
    m[k] = (m[k]||0) + (numCol===COUNT_COL ? 1 : v);
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,topN);
}

function buildAiContext(report, varaq, stats){
  const lines = [];
  lines.push(`Fayl: ${report.fayl_nomi}, Varaq: "${varaq.nomi}"`);
  lines.push(`Qatorlar soni: ${stats.rowCount}`);
  lines.push(`Ustunlar: ${varaq.ustunlar.map(u=>`${u.nomi} (${u.turi})`).join(", ")}`);
  stats.numCols.forEach(c=>{
    const s = stats.numStats[c];
    if (s) lines.push(`"${c}" statistikasi: jami=${fmtNum(s.sum)}, o'rtacha=${fmtNum(s.avg)}, min=${fmtNum(s.min)}, max=${fmtNum(s.max)}, soni=${s.count}`);
  });
  stats.catCols.forEach(c=>{
    const top = stats.catCounts[c];
    if (top && top.length) lines.push(`"${c}" bo'yicha eng ko'p uchraydigan (${stats.catDistinct[c]} ta noyob qiymatdan, top ${top.length}): ${top.map(([k,n])=>`${k} (${n})`).join(", ")}`);
  });
  stats.dateCols.forEach(c=>{
    const r = stats.dateRange[c];
    if (r.min) lines.push(`"${c}" sana oralig'i: ${r.min} dan ${r.max} gacha`);
  });
  return lines.join("\n");
}

// ---------- UI ----------

function App(){
  const [reports,setReports] = useState([]); // yengil ro'yxat
  const [current,setCurrent] = useState(null); // to'liq hisobot (varaqlar+qatorlar bilan)
  const [sheetIdx,setSheetIdx] = useState(0);
  const [loaded,setLoaded] = useState(false);
  const [busy,setBusy] = useState(false);
  const [dragging,setDragging] = useState(false);
  const [aiText,setAiText] = useState("");
  const [aiLoading,setAiLoading] = useState(false);
  const [aiErr,setAiErr] = useState(false);
  const [aiErrDetail,setAiErrDetail] = useState("");
  const [dateCol,setDateCol] = useState("");
  const [catCol,setCatCol] = useState("");
  const [numCol1,setNumCol1] = useState("");
  const [numCol2,setNumCol2] = useState("");
  const [page,setPage] = useState(1);
  const PAGE_SIZE = 50;
  const fileRef = useRef(null);
  const chartRef1 = useRef(null);
  const chartRef2 = useRef(null);
  const chartObj1 = useRef(null);
  const chartObj2 = useRef(null);

  const loadReportsList = async () => {
    const res = await fetch("/api/hisobotlar");
    if (res.ok) return (await res.json()).hisobotlar;
    return [];
  };

  const loadFullReport = async (id) => {
    const res = await fetch(`/api/hisobotlar/${id}`);
    if (res.ok) return sanitizeReport(await res.json());
    return null;
  };

  useEffect(() => {
    (async () => {
      try {
        const list = await loadReportsList();
        setReports(list);
        if (list.length>0){
          const full = await loadFullReport(list[0].id);
          setCurrent(full);
        }
      } catch(e){ console.error("Yuklashda xatolik:", e); }
      setLoaded(true);
    })();
  }, []);

  useEffect(()=>{ setSheetIdx(0); setAiText(""); setAiErr(false); setPage(1); }, [current && current.id]);

  const varaq = current && current.varaqlar && current.varaqlar[sheetIdx];
  const stats = useMemo(()=> varaq ? computeStats(varaq.ustunlar, varaq.qatorlar) : null, [varaq]);

  useEffect(()=>{
    if (!stats) return;
    setDateCol(stats.dateCols[0] || "");
    const bestCat = stats.catCols.find(c => stats.catDistinct[c] <= 30) || stats.catCols[0] || "";
    setCatCol(bestCat);
    const defaultNum = stats.numCols[0] || COUNT_COL;
    setNumCol1(defaultNum);
    setNumCol2(defaultNum);
    setPage(1);
  }, [varaq]);

  const parseAndUpload = async (file) => {
    setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const varaqlar = parseWorkbookToVaraqlar(buf);
      if (varaqlar.length===0){
        alert("Fayldan jadval ma'lumoti topilmadi (varaqlar bo'sh ko'rinadi).");
        setBusy(false);
        return;
      }
      const res = await fetch("/api/hisobotlar", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fayl_nomi: file.name, varaqlar})
      });
      if (!res.ok){
        const err = await res.json().catch(()=>({}));
        alert("Faylni saqlashda xatolik: " + (err.error || res.status));
        setBusy(false);
        return;
      }
      const created = sanitizeReport(await res.json());
      const list = await loadReportsList();
      setReports(list);
      setCurrent(created);
    } catch(err){
      console.error(err);
      alert("Faylni o'qib bo'lmadi. .xlsx/.xls/.csv formatda ekanini tekshiring.");
    }
    setBusy(false);
  };

  const onFileInput = (e) => { if(e.target.files[0]) parseAndUpload(e.target.files[0]); e.target.value=""; };
  const onDrop = (e) => { e.preventDefault(); setDragging(false); if(e.dataTransfer.files[0]) parseAndUpload(e.dataTransfer.files[0]); };

  const selectReport = async (id) => {
    if (current && current.id===id) return;
    const full = await loadFullReport(id);
    if (full) setCurrent(full);
  };

  const deleteReport = async (id, ev) => {
    ev.stopPropagation();
    if(!confirm("Shu hisobotni o'chirmoqchimisiz?")) return;
    await fetch(`/api/hisobotlar/${id}`, {method:"DELETE"});
    const list = await loadReportsList();
    setReports(list);
    if (current && current.id===id){
      if (list.length>0){ setCurrent(await loadFullReport(list[0].id)); }
      else setCurrent(null);
    }
  };

  const seriesMonth = useMemo(()=>{
    if (!varaq || !dateCol || !numCol1) return [];
    return groupByMonth(varaq.qatorlar, dateCol, numCol1);
  }, [varaq, dateCol, numCol1]);

  const seriesCategory = useMemo(()=>{
    if (!varaq || !catCol || !numCol2) return [];
    return groupByCategory(varaq.qatorlar, catCol, numCol2);
  }, [varaq, catCol, numCol2]);

  useEffect(()=>{
    if(!loaded) return;
    if(chartObj1.current){ chartObj1.current.destroy(); chartObj1.current=null; }
    if(chartObj2.current){ chartObj2.current.destroy(); chartObj2.current=null; }

    if(seriesMonth.length>0 && chartRef1.current){
      chartObj1.current = new Chart(chartRef1.current, {
        type:"bar",
        data:{ labels:seriesMonth.map(e=>e[0]), datasets:[{data:seriesMonth.map(e=>e[1]), backgroundColor:"#5B8DEF", borderRadius:5, maxBarThickness:26}]},
        options:{responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{y:{ticks:{color:"#8B93A3",font:{size:9}},grid:{color:"#2A2F3A"}},
                  x:{ticks:{color:"#8B93A3",font:{size:10}},grid:{display:false}}}}
      });
    }
    if(seriesCategory.length>0 && chartRef2.current){
      chartObj2.current = new Chart(chartRef2.current, {
        type:"bar",
        data:{ labels:seriesCategory.map(e=>e[0]), datasets:[{data:seriesCategory.map(e=>e[1]), backgroundColor:"#3FD6A8", borderRadius:5, maxBarThickness:18}]},
        options:{indexAxis:"y", responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{x:{ticks:{color:"#8B93A3",font:{size:9}},grid:{color:"#2A2F3A"}},
                  y:{ticks:{color:"#8B93A3",font:{size:10}},grid:{display:false}}}}
      });
    }
  }, [loaded, seriesMonth.map(e=>e[0]+e[1]).join(","), seriesCategory.map(e=>e[0]+e[1]).join(",")]);

  const askAI = async () => {
    if (!varaq || !stats) return;
    setAiLoading(true); setAiErr(false); setAiErrDetail(""); setAiText("");
    const context = buildAiContext(current, varaq, stats);
    try {
      const resp = await fetch("/api/xulosa", {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({context})
      });
      const respData = await resp.json();
      if(!resp.ok || respData.error){
        setAiErr(true); setAiErrDetail(respData.error || `HTTP ${resp.status}`);
        setAiText("AI xulosa olishda xatolik yuz berdi.");
      } else {
        setAiText(respData.xulosa || "AI javob qaytarmadi.");
      }
    } catch(e){
      setAiErr(true); setAiErrDetail(String(e.message || e));
      setAiText("Xulosa olishda xatolik yuz berdi. Server ishlab turganini tekshiring.");
    }
    setAiLoading(false);
  };

  const todayStr = new Date().toISOString().slice(0,10);

  const tableRows = varaq ? varaq.qatorlar : [];
  const totalPages = Math.max(1, Math.ceil(tableRows.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = tableRows.slice((pageSafe-1)*PAGE_SIZE, pageSafe*PAGE_SIZE);

  const numColOptions = stats ? [...stats.numCols, COUNT_COL] : [COUNT_COL];
  const numColLabel = (c) => c===COUNT_COL ? "Qatorlar soni" : c;

  const kpiCards = [];
  if (stats){
    kpiCards.push({label:"Jami qatorlar", val: fmtInt(stats.rowCount), cls:"blue"});
    stats.numCols.slice(0,5).forEach((c,i)=>{
      const s = stats.numStats[c];
      if (s) kpiCards.push({label:`Jami "${c}"`, val: fmtNum(s.sum), cls: i%2===0?"pos":"accent"});
    });
    if (stats.dateCols[0]){
      const r = stats.dateRange[stats.dateCols[0]];
      if (r.min) kpiCards.push({label:`Sana oralig'i (${stats.dateCols[0]})`, val:`${r.min} — ${r.max}`, cls:"blue"});
    }
    if (stats.catCols[0]){
      kpiCards.push({label:`Noyob "${stats.catCols[0]}"`, val: fmtInt(stats.catDistinct[stats.catCols[0]]), cls:"accent"});
    }
  }

  return (
    <div className="wrap">
      <div className="masthead">
        <h1>Xulosa AI</h1>
        <span className="date">{todayStr}</span>
      </div>
      <p className="subtitle">Istalgan tuzilishdagi Excel (yoki CSV) faylni yuklang — bot ustunlarni o'zi taniydi, dashboard va AI xulosa avtomatik chiqadi</p>

      <div className="panel">
        <div
          className={"drop" + (dragging ? " drag" : "") + (busy ? " busy" : "")}
          onClick={()=>!busy && fileRef.current.click()}
          onDragOver={(e)=>{e.preventDefault();setDragging(true);}}
          onDragLeave={()=>setDragging(false)}
          onDrop={onDrop}
        >
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onFileInput} />
          <div className="icon">↑</div>
          <div className="main">{busy ? "Yuklanmoqda..." : "Excel yoki CSV faylni shu yerga tashlang yoki bosib tanlang"}</div>
          <div className="sub">Har qanday varaq va ustun nomlari bilan ishlaydi</div>
        </div>

        {reports.length>0 && (
          <div className="row-top" style={{marginTop:18}}>
            <div className="reports-bar">
              <span className="count">Hisobotlar:</span>
              {reports.map(r=>(
                <div key={r.id} className="file-chip" style={{
                  borderColor: current && current.id===r.id ? "var(--blue)" : "var(--border)",
                  cursor:"pointer"
                }} onClick={()=>selectReport(r.id)}>
                  <span style={{color: current && current.id===r.id ? "var(--blue)" : "var(--text)"}}>{r.fayl_nomi}</span>
                  <span className="x" onClick={(ev)=>deleteReport(r.id, ev)}>✕</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {current && varaq && (
        <>
          {current.varaqlar.length>1 && (
            <div className="sheet-tabs">
              {current.varaqlar.map((v,i)=>(
                <div key={i} className={"sheet-tab" + (i===sheetIdx?" active":"")} onClick={()=>setSheetIdx(i)}>
                  {v.nomi} ({v.qatorlar.length})
                </div>
              ))}
            </div>
          )}

          <div className="row-top" style={{marginTop:16}}>
            <span className="count">{current.fayl_nomi} · {varaq.nomi} · {stats.rowCount} qator</span>
            <button className="btn" onClick={askAI} disabled={aiLoading}>{aiLoading ? "Tahlil qilinmoqda..." : "AI xulosa chiqarish"}</button>
          </div>

          <div className="kpis">
            {kpiCards.map((k,i)=>(
              <div key={i} className={"kpi "+k.cls}><div className="label">{k.label}</div><div className="val">{k.val}</div></div>
            ))}
          </div>

          <div className="charts">
            <div className="chart-box">
              <div className="chead">
                <h3>Oylar bo'yicha</h3>
                <div className="chead-selects">
                  {stats.dateCols.length>0 && (
                    <select value={dateCol} onChange={e=>setDateCol(e.target.value)}>
                      {stats.dateCols.map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                  )}
                  {numColOptions.length>0 && (
                    <select value={numCol1} onChange={e=>setNumCol1(e.target.value)}>
                      {numColOptions.map(c=><option key={c} value={c}>{numColLabel(c)}</option>)}
                    </select>
                  )}
                </div>
              </div>
              <div className="canvas-wrap">
                {stats.dateCols.length===0 ? <div className="empty">Sana ustuni topilmadi</div>
                  : seriesMonth.length>0 ? <canvas ref={chartRef1}></canvas> : <div className="empty">Grafik uchun ma'lumot yo'q</div>}
              </div>
            </div>
            <div className="chart-box">
              <div className="chead">
                <h3>Kategoriya bo'yicha (TOP 10)</h3>
                <div className="chead-selects">
                  {stats.catCols.length>0 && (
                    <select value={catCol} onChange={e=>setCatCol(e.target.value)}>
                      {stats.catCols.map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                  )}
                  {numColOptions.length>0 && (
                    <select value={numCol2} onChange={e=>setNumCol2(e.target.value)}>
                      {numColOptions.map(c=><option key={c} value={c}>{numColLabel(c)}</option>)}
                    </select>
                  )}
                </div>
              </div>
              <div className="canvas-wrap">
                {stats.catCols.length===0 ? <div className="empty">Matn (kategoriya) ustuni topilmadi</div>
                  : seriesCategory.length>0 ? <canvas ref={chartRef2}></canvas> : <div className="empty">Grafik uchun ma'lumot yo'q</div>}
              </div>
            </div>
          </div>

          {(aiText || aiLoading) && (
            <div className={"note" + (aiLoading?" loading":"") + (aiErr?" err":"")}>
              <div className="tag-label">{aiErr ? "Xatolik" : "AI Xulosa"}</div>
              <p>{aiLoading ? "AI ma'lumotlarni tahlil qilyapti, biroz kuting..." : aiText}</p>
              {aiErr && aiErrDetail && <div className="err-detail">Texnik tafsilot: {aiErrDetail}</div>}
            </div>
          )}

          <p className="section-title">Jadval ({varaq.ustunlar.length} ustun, {tableRows.length} qator)</p>
          <div className="table-scroll">
            <table className="entries">
              <thead>
                <tr>{varaq.ustunlar.map(u=><th key={u.nomi}>{u.nomi}</th>)}</tr>
              </thead>
              <tbody>
                {pageRows.map((r,i)=>(
                  <tr key={i}>
                    {varaq.ustunlar.map(u=>(
                      <td key={u.nomi} style={{textAlign: u.turi==="son"?"right":"left"}}>
                        {u.turi==="son" ? fmtNum(r[u.nomi]) : (r[u.nomi]===""?"-":String(r[u.nomi]))}
                      </td>
                    ))}
                  </tr>
                ))}
                {pageRows.length===0 && (
                  <tr><td colSpan={varaq.ustunlar.length} style={{textAlign:"center",color:"var(--text-soft)",padding:20}}>Ma'lumot yo'q</td></tr>
                )}
              </tbody>
            </table>
          </div>
          {totalPages>1 && (
            <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:10,marginTop:12}}>
              <button className="btn ghost small" disabled={pageSafe<=1} onClick={()=>setPage(p=>p-1)}>← Oldingi</button>
              <span className="count">{pageSafe} / {totalPages}</span>
              <button className="btn ghost small" disabled={pageSafe>=totalPages} onClick={()=>setPage(p=>p+1)}>Keyingi →</button>
            </div>
          )}
        </>
        )}

        {!current && loaded && <div className="empty">Hali hisobot yuklanmagan. Yuqoridagi joyga Excel yoki CSV faylni tashlang.</div>}
      </div>

      <div className="foot">Ma'lumotlar serverda saqlanadi — hammasi bir xil hisobotlarni ko'radi. Har qanday Excel shablon qo'llab-quvvatlanadi.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
